name: Release

# Nothing builds on pull requests or merges. Two tags per version:
#
#   vX.Y.Z-qa   → QA. Builds the .deb (and proves it on the arm64 runner),
#                 builds the Raspberry Pi image with pi-gen, and publishes a
#                 GitHub *pre-release* with the image, checksums, .deb files and
#                 the Raspberry Pi Imager os-list.json. This is what gets
#                 flashed onto the test Pi. (vX.Y.Z-qa.2, -qa.3… for retries.)
#   vX.Y.Z      → Prod. No rebuild: takes the assets of the QA release for the
#                 same commit, verifies the checksums, points os-list.json at
#                 the prod URLs and publishes them as the *latest* release —
#                 the one FieldLink offers for download.
#
# Both also publish the .deb to the matching apt channel (the "apt-qa" /
# "apt-prod" releases hold a signed flat apt repository that deployed kiosks
# update from overnight), once the signing key exists: the public half is
# committed as app/debian/fieldlink-apt.public.asc and the private half is the
# APT_SIGNING_KEY secret (docs/apt-signing.md). Without the public key file
# the packages are built without an update channel and this step is skipped.
#
# X.Y.Z must equal app/package.json, and the prod tag must point at the same
# commit as the QA tag it promotes. Both jobs run on the free arm64 runners.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tag:
    name: Classify tag
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.t.outputs.version }}
      channel: ${{ steps.t.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          pkg="$(node -p "require('./app/package.json').version")"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-qa(\.[0-9]+)?$ ]]; then channel=qa; version="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then channel=prod; version="${BASH_REMATCH[1]}"
          else echo "::error::tag $tag is neither vX.Y.Z-qa nor vX.Y.Z"; exit 1; fi
          if [[ "$version" != "$pkg" ]]; then echo "::error::tag $tag does not match app/package.json version $pkg"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "$tag → $channel $version"

  deb:
    name: QA · build and test .deb
    needs: tag
    if: needs.tag.outputs.channel == 'qa'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 package
        uses: ./.github/actions/build-deb
        with:
          arch: arm64
      - name: Build amd64 package (Debian VM test loop)
        uses: ./.github/actions/build-deb
        with:
          arch: amd64

      - name: Install the arm64 package on this runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          # cage/NetworkManager are not used by the smoke test (it runs under
          # Xvfb) but the package depends on them, so let apt resolve everything the Pi will.
          sudo apt-get install -y ./app/dist/fieldlink-pi-kiosk_*_arm64.deb
          dpkg -s fieldlink-pi-kiosk | head -8
          test -x /opt/fieldlink-pi-kiosk/fieldlink-pi-kiosk
          test -u /opt/fieldlink-pi-kiosk/chrome-sandbox
          id kiosk
          systemctl cat fieldlink-kiosk.service >/dev/null

      - name: Check shared libraries resolve
        run: |
          missing=$(ldd /opt/fieldlink-pi-kiosk/fieldlink-pi-kiosk | grep 'not found' || true)
          if [ -n "$missing" ]; then echo "$missing"; echo "::error::unresolved shared libraries — add them to app/debian/control.in"; exit 1; fi
          echo "all shared libraries resolved"

      - name: Smoke test (packaged app starts, renders the recovery screen, receives the corner-hold gesture)
        run: |
          xvfb-run -a --server-args='-screen 0 1920x1080x24' \
            /opt/fieldlink-pi-kiosk/fieldlink-pi-kiosk --smoke-test --no-sandbox --disable-gpu 2>&1 | tee smoke.log
          grep -q 'smoke-test: recovery screen loaded (ok)' smoke.log
          grep -q 'smoke-test: corner-hold gesture received' smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: fieldlink-pi-kiosk-deb
          path: |
            app/dist/*.deb
            app/dist/*.sha256
          if-no-files-found: error

  image:
    name: QA · build image and publish pre-release
    needs: [tag, deb]
    if: needs.tag.outputs.channel == 'qa'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the .deb into the stage
        uses: actions/download-artifact@v4
        with:
          name: fieldlink-pi-kiosk-deb
          path: image/stage-fieldlink/00-kiosk/files

      - name: Keep only the arm64 package in the stage
        run: |
          cd image/stage-fieldlink/00-kiosk/files
          rm -f ./*amd64* ./*.sha256
          ls -l

      # pi-gen insists on a password when the first-boot user rename is disabled
      # (the rename wizard would otherwise take over tty1 and the TV). The image
      # is public, so the password is random, masked and discarded: the account
      # is reachable only with an SSH key added through Imager's OS customisation.
      - name: Throwaway password for the first user
        id: pw
        run: |
          pw="$(openssl rand -base64 30 | tr -d '/+=' | cut -c1-32)"
          echo "::add-mask::$pw"
          echo "pw=$pw" >> "$GITHUB_OUTPUT"

      - name: Build with pi-gen
        id: pigen
        uses: usimd/pi-gen-action@v1
        with:
          image-name: fieldlink-kiosk
          pi-gen-version: arm64
          pi-gen-release: FieldLink kiosk ${{ env.VERSION }}
          release: trixie
          stage-list: stage0 stage1 stage2 ./image/stage-fieldlink
          export-last-stage-only: true
          compression: xz
          compression-level: 6
          hostname: fieldlink-kiosk
          locale: en_US.UTF-8
          keyboard-keymap: us
          keyboard-layout: English (US)
          timezone: America/New_York
          # Sets the regulatory domain and unblocks the radio; without it
          # NetworkManager starts with Wi-Fi disabled and no hotspot is possible.
          wpa-country: US
          username: fieldlink
          password: ${{ steps.pw.outputs.pw }}
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          # No cloud-init: on first boot it creates its default user "pi", and
          # Raspberry Pi's cloud-init hook then runs rename-user, which enables
          # the first-boot wizard (keyboard dialog + username prompt) on the TV.
          # Imager's OS customisation still works through the classic
          # firstrun.sh path shipped by raspberrypi-sys-mods.
          enable-cloud-init: 0
          verbose-output: true
          docker-opts: -e FIELDLINK_IMAGE_VERSION=${{ env.VERSION }}

      - name: Name, checksum and describe the image
        id: out
        run: |
          set -euo pipefail
          src="${{ steps.pigen.outputs.image-path }}"
          test -f "$src"
          mkdir -p out
          name="fieldlink-kiosk-${VERSION}-arm64.img.xz"
          mv "$src" "out/$name"
          cd out
          sha256sum "$name" > "$name.sha256"
          # Raspberry Pi Imager wants the size and sha256 of the *uncompressed*
          # image; one streaming pass does both.
          read -r extract_sha256 extract_size < <(python3 -c '
          import hashlib, lzma, sys
          h = hashlib.sha256(); n = 0
          with lzma.open(sys.argv[1]) as f:
              for chunk in iter(lambda: f.read(1 << 22), b""):
                  h.update(chunk); n += len(chunk)
          print(h.hexdigest(), n)' "$name")
          download_size=$(stat -c %s "$name")
          download_sha256=$(cut -d' ' -f1 "$name.sha256")
          tag="${GITHUB_REF#refs/tags/}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > os-list.json <<JSON
          {
            "os_list": [
              {
                "name": "FieldLink Kiosk ${VERSION} (QA)",
                "description": "Field Link Missions lobby display. Boots to a pairing code; link it from FieldLink Admin → Kiosk.",
                "icon": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/image/imager/icon.png",
                "website": "https://fieldlinkmissions.com",
                "url": "${base}/${name}",
                "release_date": "$(date -u +%Y-%m-%d)",
                "extract_size": ${extract_size},
                "extract_sha256": "${extract_sha256}",
                "image_download_size": ${download_size},
                "image_download_sha256": "${download_sha256}",
                "init_format": "systemd",
                "devices": ["pi5-64bit", "pi4-64bit"]
              }
            ]
          }
          JSON
          python3 -m json.tool os-list.json >/dev/null
          cat os-list.json
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Collect the .deb files
        uses: actions/download-artifact@v4
        with:
          name: fieldlink-pi-kiosk-deb
          path: out

      - name: Publish QA pre-release
        id: published
        uses: softprops/action-gh-release@v2
        with:
          name: FieldLink Kiosk ${{ env.VERSION }} (QA)
          prerelease: true
          make_latest: false
          body: |
            **QA build** of the Raspberry Pi kiosk image `${{ steps.out.outputs.name }}` (Raspberry Pi OS Lite trixie, arm64, Pi 4 and Pi 5) and the kiosk app package. For testing on the bench; not the download churches get.

            Flash with Raspberry Pi Imager → *Use custom*, or add this list as a repository: `https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/os-list.json`.

            When it passes the flash-and-check list, tag the same commit `v${{ env.VERSION }}` to publish it as the production release without rebuilding.
          files: |
            out/*.img.xz
            out/*.img.xz.sha256
            out/os-list.json
            out/*.deb
            out/*.deb.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The FieldLink QA server caches which image build it hands out for an
      # hour; this makes the new one show up on Admin → Kiosk at once. Both
      # secrets are optional (the Windows kiosk repo uses the same pair).
      - name: Tell the FieldLink QA server about the new build
        if: always() && steps.published.outcome == 'success'
        env:
          SERVER_URL: ${{ secrets.FIELDLINK_QA_SERVER_URL }}
          WEBHOOK_SECRET: ${{ secrets.KIOSK_QA_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then echo "FIELDLINK_QA_SERVER_URL / KIOSK_QA_WEBHOOK_SECRET not set; skipping cache invalidation"; exit 0; fi
          curl -fsS -X POST "${SERVER_URL%/}/api/kiosk/installer/invalidate" -H "x-webhook-secret: $WEBHOOK_SECRET" -H 'Content-Type: application/json' \
            && echo "FieldLink QA server cache invalidated" || echo "::warning::cache invalidation skipped ($SERVER_URL did not accept it; the server refreshes within an hour anyway)"

      - name: Publish the .deb to the apt-qa channel
        if: hashFiles('app/debian/fieldlink-apt.public.asc') != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-apt.sh qa out/*.deb

  promote:
    name: Prod · promote the QA release
    needs: tag
    if: needs.tag.outputs.channel == 'prod'
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find the QA tag for this commit
        id: qa
        run: |
          set -euo pipefail
          prod_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          qa_tag=""
          for t in $(git tag -l "v${VERSION}-qa" "v${VERSION}-qa.*" --sort=-v:refname); do
            if [[ "$(git rev-parse "${t}^{commit}")" == "$prod_sha" ]]; then qa_tag="$t"; break; fi
          done
          if [[ -z "$qa_tag" ]]; then
            echo "::error::no v${VERSION}-qa tag points at commit ${prod_sha}. Tag QA first, test it, then tag the same commit v${VERSION}."; exit 1
          fi
          gh release view "$qa_tag" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease -q '.tagName + " prerelease=" + (.isPrerelease|tostring)'
          echo "qa_tag=$qa_tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify the QA assets
        run: |
          set -euo pipefail
          mkdir -p out && cd out
          gh release download "${{ steps.qa.outputs.qa_tag }}" --repo "$GITHUB_REPOSITORY"
          ls -l
          for f in *.sha256; do sha256sum -c "$f"; done
          # Same files, prod URLs and name.
          python3 - <<PY
          import json
          p = 'os-list.json'
          d = json.load(open(p))
          for e in d['os_list']:
              e['url'] = e['url'].replace('/releases/download/${{ steps.qa.outputs.qa_tag }}/', '/releases/download/v${VERSION}/')
              e['name'] = e['name'].replace(' (QA)', '')
          json.dump(d, open(p, 'w'), indent=2)
          print(open(p).read())
          PY

      - name: Publish production release
        id: published
        uses: softprops/action-gh-release@v2
        with:
          name: FieldLink Kiosk ${{ env.VERSION }}
          prerelease: false
          make_latest: true
          body: |
            Raspberry Pi kiosk image `fieldlink-kiosk-${{ env.VERSION }}-arm64.img.xz` (Raspberry Pi OS Lite trixie, arm64, Pi 4 and Pi 5) and the kiosk app package. Same build as `${{ steps.qa.outputs.qa_tag }}`, promoted after testing.

            **Flash it** with Raspberry Pi Imager → *Use custom*, or add this list as a repository: `https://github.com/${{ github.repository }}/releases/latest/download/os-list.json`.
          files: |
            out/*.img.xz
            out/*.img.xz.sha256
            out/os-list.json
            out/*.deb
            out/*.deb.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The FieldLink production server caches which image build it hands out for an
      # hour; this makes the new one show up on Admin → Kiosk at once. Both
      # secrets are optional (the Windows kiosk repo uses the same pair).
      - name: Tell the FieldLink production server about the new build
        if: always() && steps.published.outcome == 'success'
        env:
          SERVER_URL: ${{ secrets.FIELDLINK_SERVER_URL }}
          WEBHOOK_SECRET: ${{ secrets.KIOSK_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then echo "FIELDLINK_SERVER_URL / KIOSK_WEBHOOK_SECRET not set; skipping cache invalidation"; exit 0; fi
          curl -fsS -X POST "${SERVER_URL%/}/api/kiosk/installer/invalidate" -H "x-webhook-secret: $WEBHOOK_SECRET" -H 'Content-Type: application/json' \
            && echo "FieldLink production server cache invalidated" || echo "::warning::cache invalidation skipped ($SERVER_URL did not accept it; the server refreshes within an hour anyway)"

      - name: Publish the .deb to the apt-prod channel
        if: hashFiles('app/debian/fieldlink-apt.public.asc') != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-apt.sh prod out/*.deb
